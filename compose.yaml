version: "3.9"

x-common-env: &common-env
  - LOG_LEVEL=$LOG_LEVEL
  - NODE_ENV=$NODE_ENV
  - APP_PORT=$APP_PORT
  - APP_HOST=$APP_HOST
  - APP_DIR=$APP_DIR
  - APP_URL=$APP_URL
  - APP_SUPER_USER_NAME=$APP_SUPER_USER_NAME
  - APP_SUPER_USER_EMAIL=$APP_SUPER_USER_EMAIL
  - APP_SUPER_USER_PASSWORD=$APP_SUPER_USER_PASSWORD
  - FRONTEND_POLICY_URL=$FRONTEND_POLICY_URL
  - FRONTEND_TERMS_URL=$FRONTEND_TERMS_URL
  - DB_HOST=$DB_HOST
  - DB_PORT=$DB_PORT
  - DB_USER=$DB_USER
  - DB_PASS=$DB_PASS
  - DB_NAME=$DB_NAME
  - DB_TIMEZONE=$DB_TIMEZONE
  - DB_LOGGING=$DB_LOGGING
  - DB_SYNCHRONIZE=$DB_SYNCHRONIZE
  - SMTP_HOST=$SMTP_HOST
  - SMTP_PORT=$SMTP_PORT
  - SMTP_USER=$SMTP_USER
  - SMTP_PASS=$SMTP_PASS
  - SMTP_ORIGIN=$SMTP_ORIGIN
  - STRIPE_KEY=$STRIPE_KEY
  - STRIPE_ENDPOINT_SECRET=$STRIPE_ENDPOINT_SECRET
  - JWT_TOKEN_SECRET=$JWT_TOKEN_SECRET
  - BCRYPT_SALT_ROUNDS=$BCRYPT_SALT_ROUNDS
  - VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY
  - VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY
  - REDIS_HOST=$REDIS_HOST
  - REDIS_PORT=$REDIS_PORT
  - REDIS_PASSWORD=$REDIS_PASSWORD
  - BULLBOARD_USER_LOGIN=$BULLBOARD_USER_LOGIN
  - BULLBOARD_USER_PASSWORD=$BULLBOARD_USER_PASSWORD
  - TESTING_DEFAULT_USER_PASSWORD=$TESTING_DEFAULT_USER_PASSWORD
  - TESTING_DEFAULT_OTP_CODE=$TESTING_DEFAULT_OTP_CODE

services:
  postgresdb:
    container_name: postgres
    image: postgres
    restart: unless-stopped
    ports:
      - 5432:5432
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - backend_db:/var/lib/postgresql/18/docker
    networks:
      - app-network
    environment:
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASS
      - POSTGRES_DB=$DB_NAME

  redis:
    container_name: redis
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    environment:
      - REDIS_PASSWORD=$REDIS_PASSWORD

  bullboard:
    container_name: bullboard
    image: deadly0/bull-board
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "4000:3000"
    networks:
      - app-network
    environment:
      REDIS_HOST: $REDIS_HOST
      REDIS_PORT: $REDIS_PORT
      REDIS_PASSWORD: $REDIS_PASSWORD
      REDIS_USE_TLS: "false"
      USER_LOGIN: $BULLBOARD_USER_LOGIN
      USER_PASSWORD: $BULLBOARD_USER_PASSWORD

  app:
    container_name: api
    restart: unless-stopped
    profiles: ["prod"]
    build: .
    depends_on:
      - postgresdb
    ports:
      - 3333:3333
    volumes:
      - backend_uploads:/usr/src/app/uploads
    networks:
      - app-network
    stdin_open: true
    tty: true
    environment: *common-env
 
  app-test:
    container_name: api-test
    restart: no
    profiles: ["test", "jest"]
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      - postgresdb
    ports:
      - "3333:3333"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3333"]  
      interval: 5s
      timeout: 5s
      retries: 5
    environment: *common-env

  app-dev:
    container_name: api-dev
    restart: no
    profiles: ["dev"]
    env_file: .env.docker.dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      - postgresdb
      - redis
      - bullboard
      - backup
    ports:
      - "3333:3333"
    networks:
      - app-network
    volumes:
      - .:/workspace
    command: tail -f /dev/null
    stdin_open: true
    tty: true

  jest: 
    container_name: jest
    restart: no
    profiles: ["jest"]
    build: 
      context: .
      dockerfile: Dockerfile.jest
    depends_on:
      app-test:
        condition: service_healthy
    networks:
      - app-network
    environment: *common-env

  backup:
    container_name: backup
    image: offen/docker-volume-backup:latest
    restart: unless-stopped
    volumes:
      - backend_db:/backup/db:ro
      - backend_uploads:/backup/uploads:ro
      - redis_data:/backup/redis:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backups:/archive
    environment:
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASS
      - POSTGRES_DB=$DB_NAME
      - SCHEDULE=0 2 * * *
      - BACKUP_SOURCES=/backup
      - BACKUP_FILENAME=backup-%d-%m-%Y.tar.gz
      - BACKUP_RETENTION_DAYS=7
      - BACKUP_RETENTION_WEEKS=4
      - BACKUP_RETENTION_MONTHS=6
    networks:
      - app-network

volumes:
  backend_db:
    external: true
  backend_uploads:
    external: true
  redis_data:
    external: true

networks:
  app-network:
    driver: bridge
