version: "3.8"

services:
  postgresdb:
    container_name: postgres
    image: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASS
      - POSTGRES_DB=$DB_NAME
    volumes:
      - backend_db:/var/lib/postgresql/18/docker
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  redis:
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=$REDIS_PASSWORD
    restart: unless-stopped
    networks: 
      - app-network

  bullboard:
    container_name: bullboard
    image: deadly0/bull-board
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      REDIS_HOST: $REDIS_HOST
      REDIS_PORT: $REDIS_PORT
      REDIS_PASSWORD: $REDIS_PASSWORD
      REDIS_USE_TLS: "false"
      USER_LOGIN: $BULLBOARD_USER_LOGIN
      USER_PASSWORD: $BULLBOARD_USER_PASSWORD
    depends_on:
      - redis
    networks:
      - app-network

  app:
    container_name: api
    depends_on:
      - postgresdb
    build: .
    restart: unless-stopped
    ports:
      - 3333:3333
    stdin_open: true
    tty: true
    volumes:
      - backend_uploads:/usr/src/app/uploads
    networks:
      - app-network
    environment:
      - NODE_ENV=$NODE_ENV
      - APP_PORT=$APP_PORT
      - APP_HOST=$APP_HOST
      - APP_DIR=$APP_DIR
      - APP_URL=$APP_URL
      - APP_SUPER_USER_NAME=$APP_SUPER_USER_NAME
      - APP_SUPER_USER_EMAIL=$APP_SUPER_USER_EMAIL
      - APP_SUPER_USER_PASSWORD=$APP_SUPER_USER_PASSWORD
      - FRONTEND_POLICY_URL=$FRONTEND_POLICY_URL
      - FRONTEND_TERMS_URL=$FRONTEND_TERMS_URL
      - DB_HOST=$DB_HOST
      - DB_PORT=$DB_PORT
      - DB_USER=$DB_USER
      - DB_PASS=$DB_PASS
      - DB_NAME=$DB_NAME
      - DB_TIMEZONE=$DB_TIMEZONE
      - DB_LOGGING=$DB_LOGGING
      - DB_SYNCHRONIZE=$DB_SYNCHRONIZE
      - SMTP_HOST=$SMTP_HOST
      - SMTP_PORT=$SMTP_PORT
      - SMTP_USER=$SMTP_USER
      - SMTP_PASS=$SMTP_PASS
      - SMTP_ORIGIN=$SMTP_ORIGIN
      - STRIPE_KEY=$STRIPE_KEY
      - STRIPE_ENDPOINT_SECRET=$STRIPE_ENDPOINT_SECRET
      - JWT_TOKEN_SECRET=$JWT_TOKEN_SECRET
      - BCRYPT_SALT_ROUNDS=$BCRYPT_SALT_ROUNDS
      - VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY
      - VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY
      - REDIS_HOST=$REDIS_HOST
      - REDIS_PORT=$REDIS_PORT
      - REDIS_PASSWORD=$REDIS_PASSWORD
      - BULLBOARD_USER_LOGIN=$BULLBOARD_USER_LOGIN
      - BULLBOARD_USER_PASSWORD=$BULLBOARD_USER_PASSWORD

  backup:
    container_name: backup
    image: offen/docker-volume-backup:latest
    restart: unless-stopped
    volumes:
      - backend_db:/backup/db:ro
      - backend_uploads:/backup/uploads:ro
      - redis_data:/backup/redis:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backups:/archive
    environment:
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASS
      - POSTGRES_DB=$DB_NAME
      - SCHEDULE=0 2 * * *
      - BACKUP_SOURCES=/backup
      - BACKUP_FILENAME=backup-%d-%m-%Y.tar.gz
      - BACKUP_RETENTION_DAYS=7
      - BACKUP_RETENTION_WEEKS=4
      - BACKUP_RETENTION_MONTHS=6
    networks:
      - app-network

volumes:
  backend_db:
    external: true
  backend_uploads:
    external: true
  redis_data:
    external: true

networks:
  app-network:
    driver: bridge
