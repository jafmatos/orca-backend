version: '3.8'

services:
  postgresdb:
    container_name: postgres
    image: postgres
    restart: unless-stopped
    env_file: ./.env.docker
    environment:
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASS
      - POSTGRES_DB=$DB_NAME
    ports:
      - 5432:5432
    volumes:
      - backend_db:/var/lib/postgresql/18/docker
    command: |
      bash -c "
        until pg_isready; do sleep 1; done

        sed -i '/host all all all scram-sha-256/d' /var/lib/postgresql/18/docker/pg_hba.conf

        psql -U $DB_USER -d $DB_NAME -c 'SELECT pg_reload_conf();'

        docker-entrypoint.sh postgres 
      "
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data 
    environment:
      - REDIS_PASSWORD=$REDIS_PASSWORD 
    restart: unless-stopped

  bullboard:
    container_name: bullboard
    image: deadly0/bull-board
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      REDIS_HOST: $REDIS_HOST
      REDIS_PORT: $REDIS_PORT
      REDIS_PASSWORD: $REDIS_PASSWORD
      REDIS_USE_TLS: 'false'
      USER_LOGIN: $BULLBOARD_USER_LOGIN
      USER_PASSWORD: $BULLBOARD_USER_PASSWORD
    depends_on:
      - redis

  app:
    container_name: api
    depends_on:
      - postgresdb
    build: .
    restart: unless-stopped
    env_file: ./.env.docker
    ports:
      - 3333:3333
    stdin_open: true
    tty: true
    volumes:
      - backend_uploads:/usr/src/app/uploads
  
  backup:
    container_name: backup
    image: offen/docker-volume-backup:latest
    restart: unless-stopped
    env_file: ./.env.docker
    volumes:
      - backend_db:/backup/db:ro
      - backend_uploads:/backup/uploads:ro
      - redis_data:/backup/redis:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backups:/archive
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=orca
      - SCHEDULE=0 2 * * *
      - BACKUP_SOURCES=/backup
      - BACKUP_FILENAME=backup-%d-%m-%Y.tar.gz
      - BACKUP_RETENTION_DAYS=7
      - BACKUP_RETENTION_WEEKS=4
      - BACKUP_RETENTION_MONTHS=6

volumes:
  backend_db:
    external: true
  backend_uploads:
    external: true
  redis_data:
    external: true