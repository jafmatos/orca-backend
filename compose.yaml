version: '3.9'

x-common-env: &common-env
  - SILENT=$SILENT
  - LOG_LEVEL=$LOG_LEVEL
  - NODE_ENV=$NODE_ENV
  - SEED_ON_BOOTSTRAP=$SEED_ON_BOOTSTRAP
  - APP_PORT=$APP_PORT
  - APP_HOST=$APP_HOST
  - APP_DIR=$APP_DIR
  - APP_URL=$APP_URL
  - FRONTEND_BASE_URL=$FRONTEND_BASE_URL
  - FRONTEND_POLICY_URL=$FRONTEND_POLICY_URL
  - FRONTEND_TERMS_URL=$FRONTEND_TERMS_URL
  - DB_HOST=$DB_HOST
  - DB_PORT=$DB_PORT
  - DB_USER=$DB_USER
  - DB_PASS=$DB_PASS
  - DB_NAME=$DB_NAME
  - DB_TIMEZONE=$DB_TIMEZONE
  - DB_LOGGING=$DB_LOGGING
  - DB_SYNCHRONIZE=$DB_SYNCHRONIZE
  - SMTP_HOST=$SMTP_HOST
  - SMTP_PORT=$SMTP_PORT
  - SMTP_USER=$SMTP_USER
  - SMTP_PASS=$SMTP_PASS
  - SMTP_ORIGIN=$SMTP_ORIGIN
  - STRIPE_KEY=$STRIPE_KEY
  - STRIPE_ENDPOINT_SECRET=$STRIPE_ENDPOINT_SECRET
  - JWT_TOKEN_SECRET=$JWT_TOKEN_SECRET
  - BCRYPT_SALT_ROUNDS=$BCRYPT_SALT_ROUNDS
  - VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY
  - VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY
  - REDIS_HOST=$REDIS_HOST
  - REDIS_PORT=$REDIS_PORT
  - REDIS_PASSWORD=$REDIS_PASSWORD
  - BULLBOARD_USER_LOGIN=$BULLBOARD_USER_LOGIN
  - BULLBOARD_USER_PASSWORD=$BULLBOARD_USER_PASSWORD
  - OPENAI_KEY=$OPENAI_KEY
  - OPENAI_MODEL=$OPENAI_MODEL
  - SEED_USER_DEFAULT_PASSWORD=$SEED_USER_DEFAULT_PASSWORD
  - SEED_DEFAULT_OTP_CODE=$SEED_DEFAULT_OTP_CODE
  - SEED_SUPER_USER_NAME=$SEED_SUPER_USER_NAME
  - SEED_SUPER_USER_EMAIL=$SEED_SUPER_USER_EMAIL
  - SEED_SUPER_USER_PASSWORD=$SEED_SUPER_USER_PASSWORD

services:
  postgresdb:
    container_name: postgres
    image: postgres
    restart: unless-stopped
    profiles: ['production']
    ports:
      - 5432
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - orca_backend_database:/var/lib/postgresql/18/docker
    networks:
      - app-network
    environment:
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASS
      - POSTGRES_DB=$DB_NAME
    deploy:
      resources:
        limits:
          memory: 1536M

  postgresdb-test:
    container_name: postgres-test
    image: postgres
    restart: unless-stopped
    profiles: ['test']
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - orca_backend_database_test:/var/lib/postgresql/18/docker
    networks:
      - app-network
    environment:
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASS
      - POSTGRES_DB=$DB_NAME
    deploy:
      resources:
        limits:
          memory: 1536M

  app:
    container_name: app
    restart: unless-stopped
    profiles: ['production']
    build: .
    depends_on:
      postgresdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 3333:3333
    volumes:
      - orca_backend_uploads:/usr/src/app/uploads
    networks:
      - app-network
    stdin_open: true
    tty: true
    environment: *common-env
    deploy:
      resources:
        limits:
          memory: 1024M

  app-test:
    container_name: app-test
    profiles: ['test']
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      postgresdb-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - orca_backend_uploads_test:/usr/src/app/uploads
    networks:
      - app-network
    environment: *common-env
    deploy:
      resources:
        limits:
          memory: 1024M

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ['production']
    ports:
      - '6379:6379'
    volumes:
      - orca_backend_redis:/data
    networks:
      app-network:
        aliases:
          - redis
    environment:
      - REDIS_PASSWORD=$REDIS_PASSWORD
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    labels:
      - docker-volume-backup.stop-during-backup=true
    deploy:
      resources:
        limits:
          memory: 384M
    command: >
      redis-server 
      --requirepass $REDIS_PASSWORD
      --appendonly yes 
      --appendfsync always
      --aof-use-rdb-preamble yes
      --save 1800 1
      --save 600 100
      --save 120 10000
      --maxmemory 256mb
      --maxmemory-policy noeviction

  redis-test:
    container_name: redis-test
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ['test']
    volumes:
      - orca_backend_redis_test:/data
    networks:
      app-network:
        aliases:
          - redis-test
    environment:
      - REDIS_PASSWORD=$REDIS_PASSWORD
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
    command: >
      redis-server 
      --requirepass $REDIS_PASSWORD
      --appendonly yes 
      --appendfsync always
      --aof-use-rdb-preamble yes
      --save 1800 1
      --save 600 100
      --save 120 10000
      --maxmemory 256mb
      --maxmemory-policy noeviction

  bullboard:
    container_name: bullboard
    image: deadly0/bull-board
    restart: unless-stopped
    profiles: ['development', 'production']
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '4000:3000'
    networks:
      - app-network
    environment:
      REDIS_HOST: $REDIS_HOST
      REDIS_PORT: $REDIS_PORT
      REDIS_PASSWORD: $REDIS_PASSWORD
      REDIS_USE_TLS: 'false'
      USER_LOGIN: $BULLBOARD_USER_LOGIN
      USER_PASSWORD: $BULLBOARD_USER_PASSWORD
    deploy:
      resources:
        limits:
          memory: 256M

  mailpit:
    container_name: mailpit
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M

  backup:
    container_name: backup
    image: offen/docker-volume-backup:latest
    restart: unless-stopped
    profiles: ['production']
    volumes:
      - orca_backend_database:/backup/db:ro
      - orca_backend_uploads:/backup/uploads:ro
      - orca_backend_redis:/backup/redis:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backups:/archive
    environment:
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASS
      - POSTGRES_DB=$DB_NAME
      - SCHEDULE=0 2 * * *
      - BACKUP_SOURCES=/backup
      - BACKUP_FILENAME=backup-%d-%m-%Y.tar.gz
      - BACKUP_RETENTION_DAYS=7
      - BACKUP_RETENTION_WEEKS=4
      - BACKUP_RETENTION_MONTHS=6
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  orca_backend_database:
    external: true
  orca_backend_database_test:
    external: true
  orca_backend_uploads:
    external: true
  orca_backend_uploads_test:
    external: true
  orca_backend_redis:
    external: true
  orca_backend_redis_test:
    external: true

networks:
  app-network:
    driver: bridge
