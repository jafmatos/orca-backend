# secrets.GH_REPOSITORY: The API Repository owner/repo
# secrets.GH_TOKEN: The Github authorization token
# secrets.DOCKER_ENV_FILE: The whole content of .env.docker.test needed to run npm run docker:deploy

name: api.orca-financas.com integration testing

on:
  push:
    branches: [merge]

  workflow_dispatch:

jobs:
  testing:
    runs-on: ubuntu-latest
    environment:
      name: testing
    steps:
      - name: Github Checkout
        uses: actions/checkout@v4
        with: 
          repository: ${{ secrets.GH_REPOSITORY }}
          token: ${{ secrets.GH_TOKEN }}
          path: .
      - name: Create .env.docker from secrets DOCKER_ENV_FILE
        run: |
          echo "${{ secrets.DOCKER_ENV_FILE }}" > .env.docker 
          set -a
          source .env.docker 
          set +a
      - name: Creating docker volumes
        run: |
          docker volume create backend_db
          docker volume create backend_uploads
          docker volume create redis_data
      - name: Log the .env.docker
        run: cat .env.docker
      - name: Running API
        run: npm run docker:deploy
        env: 
          DB_USER: postgres
      - name: Log the api container
        run: npm run docker:logs
      # - name: Waiting for API to be available
