# secrets.GH_REPOSITORY: The API Repository owner/repo
# secrets.GH_TOKEN: The Github authorization token
# secrets.DOCKER_ENV_FILE: The whole content of .env.docker.test needed to run npm run docker:deploy

name: api.orca-financas.com integration testing

on:
  push:
    branches: [merge]

  workflow_dispatch:

jobs:
  testing:
    runs-on: ubuntu-latest
    environment:
      name: testing
    steps:
      - name: Github Checkout
        uses: actions/checkout@v4
        with: 
          repository: ${{ secrets.GH_REPOSITORY }}
          token: ${{ secrets.GH_TOKEN }}
          path: .
      - name: Creating docker volumes
        run: |
          docker volume create backend_db
          docker volume create backend_uploads
          docker volume create redis_data
      - name: Create .env.docker.test from secrets DOCKER_ENV_FILE
        run: |
          echo "${{ secrets.DOCKER_ENV_FILE }}" > .env.docker.test
      - name: Running the migrations
        run: npm run typeorm:migrate
      - name: Running the seeders
        run: npm run typeorm:seed 
      - name: Running tests
        run: npm run docker:test
      - name: Push to branch review
        run: |
          git fetch
          git checkout -B review origin/review
          git config --global user.email "actions@github.com"
          git config --global user.name "Pipeline"
          git reset --hard merge
          git push -f origin review